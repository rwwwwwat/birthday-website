name: Keep Render and Supabase awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "API_BASE_URL is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 40 "${{ vars.API_BASE_URL }}/api/health" || true
